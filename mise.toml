# Project tasks — individual task scripts live in .mise/tasks/ (managed by milky-kit sync)
# This file defines composite tasks and project-specific overrides.

[tools]
node = "24"

[tasks.dev]
description = "Full stack in tmux split (API top, client bottom). Pass a worktree number to run in that worktree (e.g. `mise run dev 3`)."
run = """
#!/usr/bin/env bash
set -euo pipefail

WORKTREE="${1:-}"
if [ -n "$WORKTREE" ]; then
  GIT_COMMON_DIR="$(git rev-parse --path-format=absolute --git-common-dir)"
  MAIN_REPO="$(dirname "$GIT_COMMON_DIR")"
  TARGET_DIR="$MAIN_REPO/../clothes-worktrees/$WORKTREE"
  if [ ! -d "$TARGET_DIR" ]; then
    echo "No worktree at $TARGET_DIR"
    echo "Create one with: mise run worktree:setup $WORKTREE feature/#$WORKTREE.<summary>"
    exit 1
  fi
  TARGET_DIR="$(cd "$TARGET_DIR" && pwd)"
  (cd "$TARGET_DIR" && mise trust --all) >/dev/null 2>&1 || true
  SESSION="clothes-$WORKTREE"
else
  TARGET_DIR="$(pwd)"
  SESSION="clothes"
fi

if tmux has-session -t "$SESSION" 2>/dev/null; then
  echo "Session '$SESSION' already running. Attaching..."
  exec tmux attach -t "$SESSION"
fi

# Pane targeting without explicit indices — works regardless of the
# user's `pane-base-index` setting (some tmux.conf has it set to 1,
# breaking `:dev.0` lookups). After new-session the only pane is active;
# after split-window the NEW pane is active by default.
tmux new-session -d -s "$SESSION" -n dev -c "$TARGET_DIR"
tmux send-keys -t "$SESSION:dev" "mise run dev:api $WORKTREE" Enter
tmux split-window -v -t "$SESSION:dev" -c "$TARGET_DIR"
tmux send-keys -t "$SESSION:dev" "mise run dev:client $WORKTREE" Enter
tmux select-pane -U -t "$SESSION:dev"
exec tmux attach -t "$SESSION"
"""

[tasks.check]
description = "Run all quality gates"
depends = ["check:*"]

[tasks.fmt]
description = "Format everything"
depends = ["fmt:*"]

[tasks."db:generate"]
description = "Generate a Drizzle migration from the current schema"
dir = "apps/api"
run = 'pnpm db:generate'

[tasks."db:migrate"]
description = "Apply D1 migrations to the local SQLite database"
dir = "apps/api"
run = 'pnpm db:migrate:local'
